[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upd7725"
description = "The NEC uPD7720, uPD7725 and uPD96050 digital signal processors, settled against their own reference one instruction at a time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "upd7725", "coprocessor", "emulator", "conformance", "retrocomputing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gufranco/nec-upd7725-python"
Source = "https://github.com/gufranco/nec-upd7725-python"
Issues = "https://github.com/gufranco/nec-upd7725-python/issues"

[project.scripts]
upd7725-doctor = "upd7725.doctor:main"

[tool.setuptools]
packages = ["upd7725"]

[tool.setuptools.dynamic]
version = { attr = "upd7725.version.VERSION" }

[tool.setuptools.exclude-package-data]
upd7725 = ["*.test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  # N818 wants every exception to end in Error. Three of these are control flow
  # signals rather than failures, and CPython names its own that way:
  # StopIteration, SystemExit and GeneratorExit carry no suffix either. The
  # exceptions here that genuinely report a failure do end in Error.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test file sits beside the module it covers and is named after it, so its
# module name carries a dot that N999 rejects. The layout is deliberate: a
# module and its tests are read together.
"*.test.py" = ["PLR2004", "N999"]
# These are command line tools. Printing is their output, not a stray debug
# statement left behind, and routing it through a logger would put a level and
# a timestamp in front of a report meant to be read by a person.
"conformance/*.py" = ["T201"]
# The doctor exists so that nothing fails silently, which means it has to survive
# whatever a check throws at it and report that rather than propagate it. A
# narrower catch here would let an unforeseen failure escape as a traceback and
# take the rest of the report with it, which is the one outcome it must avoid.
# It prints for the same reason every tool here does: its output is the product.
"upd7725/doctor.py" = ["BLE001", "T201"]

[tool.coverage.run]
source = ["upd7725", "conformance"]
branch = true
# The runner that drives real firmware is measured out of the gate on purpose.
# Its behaviour depends on files nobody may distribute, so on a machine that has
# them one set of paths runs and on a machine that does not the other set does.
# No single build can exercise both, and a gate that demands the impossible gets
# switched off rather than met. What it does instead is report every check it
# could not run as skipped, out loud, in CI.
omit = ["conformance/against_firmware.py", "conformance/against_firmware.test.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  # A protocol body is a contract, never code: the type checker reads it and the
  # runtime never runs it, because the class exists to be satisfied rather than
  # instantiated. Demanding coverage of the ellipses would mean calling methods
  # that deliberately do nothing.
  'class .*\(.*Protocol.*\):',
  # The command line guard hands argv to a function that is itself tested, so
  # there is nothing behind it left to exercise. Importing the module to cover
  # the guard would run the tool rather than test it.
  'if __name__ == "__main__":',
  # A type checking block never runs, by definition. Python 3.14 drops it before
  # coverage can see it and earlier versions do not, so leaving it in would make
  # the gate mean one thing on the newest runtime and another on the oldest
  # supported one, which is worse than either.
  'if TYPE_CHECKING:',
  # A protocol method has no body to run, whether the ellipsis sits on its own
  # line or after the signature. The same version split applies.
  '^\s*\.\.\.$',
  ': \.\.\.$',
]

[tool.mypy]
# Every flag mypy has, plus the ones strict does not turn on. A model of a
# processor is arithmetic on masked integers from end to end, and the errors that
# matter most here are the ones where a width, a sign or a None slips through a
# boundary. A checker that sees the whole register file is the cheapest place to
# catch those.
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["upd7725", "conformance"]

[[tool.mypy.overrides]]
# The conformance scripts sit beside the package rather than inside it, and each
# one puts its own directory on the path before importing its neighbours. The
# checker has no such path, so it is told where to look rather than being told
# to stop looking: a skipped import would report this package as untyped and
# hide every finding in the suite that drives it.
module = ["reference", "oracle", "instructions", "against_firmware"]
ignore_missing_imports = true
