name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      # The workflows are the one thing here nothing else checks, and a mistake
      # in them is only visible once a run has already gone wrong. The archive
      # is verified by digest before anything in it runs, for the same reason
      # every image this project loads is.
      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers turned on. A
      # model of a processor is arithmetic on masked integers end to end, and a
      # checker that sees the whole register file is the cheapest place to catch a
      # width or a sign crossing a boundary it should not. The settings live in
      # pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" -v || status=1
            echo "::endgroup::"
          done < <(find upd7725 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      # No document is redistributable, so none is here and this checks nothing
      # on a runner. It says so rather than reporting a pass: the value is that
      # somebody running it with the data sheet on disk gets a real answer, and
      # that a run without it cannot be mistaken for one.
      - name: Every quoted sentence, against the document it came from
        run: python -m conformance.quotes

      # Uninstrumented, and deliberately after the coverage run rather than
      # inside it. A coverage tracer costs about ten times what the model does, so
      # a throughput check under one measures the tracer.
      - name: The model has not become several times slower
        run: python -m conformance.speed

  conformance:
    name: Conformance against the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Every field of every instruction form, against states recorded from the
      # reference. This needs no firmware at all, and it is the gate.
      - name: Settle every instruction
        run: python -m conformance.instructions

      # Live against the ported reference rather than against the recordings, on
      # a small slice. The recordings are the authority and the step above is the
      # gate; this catches a disagreement on ground the recordings do not cover,
      # cheaply enough to run on every push. The long sweep is on the schedule.
      - name: Model against reference, on a slice the corpus does not cover
        run: python -m conformance.differential --from 70000000 --cases 4000

  firmware:
    name: Against firmware, when any is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # These checks exist and are meant to be seen. They run the parts
      # themselves, from images nobody may distribute, so on a machine without
      # them every one reports as skipped rather than as quietly passed.
      - name: Run the parts themselves
        run: |
          python -m conformance.against_firmware | tee report.txt
          python conformance/against_firmware.test.py -v 2>&1 | tee -a report.txt
        shell: bash

      - name: Say what ran and what could not
        run: |
          if grep -q "skipped" report.txt; then
            echo "::notice title=Firmware checks skipped::No firmware image was present, so the checks that run the parts themselves did not run. They are not failures; they had nothing to run against."
          fi
        shell: bash
